<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PR2 Grading System - Student Roster</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-slate-950 min-h-screen text-slate-100 font-sans antialiased">

  <nav class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center space-x-4">
      <a href="teacher.html" class="flex items-center gap-1.5 text-xs font-semibold text-slate-400 hover:text-white transition bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
      </a>
      <h1 class="text-xl font-bold tracking-tight">Enrolled Students</h1>
    </div>
    <button onclick="logout()" class="flex items-center gap-2 bg-rose-600/20 hover:bg-rose-600/30 border border-rose-500/30 text-rose-300 px-4 py-2 rounded-xl text-sm font-semibold transition">
      <i data-lucide="log-out" class="w-4 h-4"></i> Log Out
    </button>
  </nav>

  <div class="max-w-6xl mx-auto p-6 animate__animated animate__fadeIn">
    <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 backdrop-blur-xl shadow-2xl">
      <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <div class="relative w-full md:w-80">
          <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"></i>
          <input type="text" id="searchInput" onkeyup="filterStudents()" placeholder="Search by name or LRN..." 
            class="w-full pl-10 pr-4 py-2.5 bg-slate-950/60 border border-slate-800 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition text-sm text-slate-100 placeholder-slate-500">
        </div>

        <div class="flex items-center gap-2 text-xs text-slate-400">
          <span class="relative flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-60"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
          </span>
          Live &bull; <span id="studentCount">0</span> students
        </div>
      </div>

      <div class="overflow-x-auto rounded-xl border border-slate-800">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-800/60 text-slate-400 text-xs font-semibold uppercase tracking-wider border-b border-slate-800">
              <th class="p-4">LRN / Student ID</th>
              <th class="p-4">Full Name</th>
              <th class="p-4">Grade & Section</th>
              <th class="p-4">Email</th>
              <th class="p-4 text-center">Action</th>
            </tr>
          </thead>
          <tbody id="studentListBody" class="divide-y divide-slate-800 text-sm text-slate-300">
            <tr>
              <td colspan="5" class="p-8 text-center text-slate-500">
                <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2 text-blue-500"></i>
                Loading roster...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const firebaseConfig = {
      apiKey: "AIzaSyCpqbqUXrxADXC5xptI91dCy3H8PlZo7u8",
      authDomain: "gradingsystem-6fbdb.firebaseapp.com",
      databaseURL: "https://gradingsystem-6fbdb-default-rtdb.firebaseio.com",
      projectId: "gradingsystem-6fbdb",
      storageBucket: "gradingsystem-6fbdb.firebasestorage.app",
      messagingSenderId: "919646538223",
      appId: "1:919646538223:web:0e427c6ecbf1d7500cce1a",
      measurementId: "G-H8DCQTXKXW"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();

    let unsubscribeStudents = null;

    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = 'index.html';
      } else if (!unsubscribeStudents) {
        listenToStudents();
      }
    });

    // REALTIME: kusang mag-a-update ang listahan kapag may bagong student
    function listenToStudents() {
      const tbody = document.getElementById('studentListBody');

      unsubscribeStudents = db.collection('users')
        .where('role', '==', 'student')
        .onSnapshot(snapshot => {
          tbody.innerHTML = '';

          document.getElementById('studentCount').textContent = snapshot.size;

          if (snapshot.empty) {
            tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-500">No registered students found.</td></tr>`;
            return;
          }

          const students = [];
          snapshot.forEach(doc => {
            students.push({ uid: doc.id, ...doc.data() });
          });

          // Sort by section, tapos by name
          students.sort((a, b) =>
            (a.section || '').localeCompare(b.section || '') ||
            (a.fullName || '').localeCompare(b.fullName || '')
          );

          students.forEach(student => {
            const tr = document.createElement('tr');
            tr.className = "student-row hover:bg-slate-800/40 transition";
            tr.innerHTML = `
              <td class="p-4 font-mono text-slate-400">${student.studentId || '-'}</td>
              <td class="p-4 font-semibold text-slate-100">${student.fullName || 'No Name'}</td>
              <td class="p-4">${student.section || '-'}</td>
              <td class="p-4 text-slate-400">${student.email || '-'}</td>
              <td class="p-4 text-center">
                <a href="encode.html?studentId=${student.uid}" class="inline-flex items-center gap-1 bg-blue-600/20 hover:bg-blue-600/30 border border-blue-500/30 text-blue-300 px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                  <i data-lucide="edit-2" class="w-3.5 h-3.5"></i> Encode Grade
                </a>
              </td>
            `;
            tbody.appendChild(tr);
          });

          lucide.createIcons();

          // Ibalik ang search filter kung may naka-type na
          filterStudents();
        }, err => {
          console.error('Error fetching data:', err);
          tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-rose-400">Error fetching data: ${err.message}</td></tr>`;
        });
    }

    function filterStudents() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.querySelectorAll('.student-row');

      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(input) ? '' : 'none';
      });
    }

    function logout() {
      if (unsubscribeStudents) unsubscribeStudents();
      auth.signOut().then(() => window.location.href = 'index.html');
    }
  </script>
</body>
</html>
