<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PR2 Grading System - Class Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-slate-950 min-h-screen text-slate-100 font-sans antialiased">

  <nav class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center space-x-4">
      <a href="gradebook.html" class="flex items-center gap-1.5 text-xs font-semibold text-slate-400 hover:text-white transition bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Gradebook
      </a>
      <h1 class="text-xl font-bold tracking-tight">Performance Statistics</h1>
    </div>
    <button onclick="logout()" class="flex items-center gap-2 bg-rose-600/20 hover:bg-rose-600/30 border border-rose-500/30 text-rose-300 px-4 py-2 rounded-xl text-sm font-semibold transition">
      <i data-lucide="log-out" class="w-4 h-4"></i> Log Out
    </button>
  </nav>

  <div class="max-w-5xl mx-auto p-6 space-y-6 animate__animated animate__fadeIn">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <div class="bg-slate-900/60 border border-slate-800 p-6 rounded-2xl shadow-xl border-l-4 border-l-blue-500 relative overflow-hidden">
        <div class="flex justify-between items-start">
          <div>
            <h3 class="text-xs text-slate-400 uppercase font-semibold tracking-wider">Total Evaluated Records</h3>
            <p id="totalRecords" class="text-4xl font-extrabold text-slate-100 mt-2">0</p>
          </div>
          <div class="p-3 bg-blue-500/10 rounded-xl">
            <i data-lucide="layers" class="w-6 h-6 text-blue-400"></i>
          </div>
        </div>
      </div>

      <div class="bg-slate-900/60 border border-slate-800 p-6 rounded-2xl shadow-xl border-l-4 border-l-emerald-500 relative overflow-hidden">
        <div class="flex justify-between items-start">
          <div>
            <h3 class="text-xs text-slate-400 uppercase font-semibold tracking-wider">Overall Class Average</h3>
            <p id="classAverage" class="text-4xl font-extrabold text-slate-100 mt-2">0.00</p>
          </div>
          <div class="p-3 bg-emerald-500/10 rounded-xl">
            <i data-lucide="calculator" class="w-6 h-6 text-emerald-400"></i>
          </div>
        </div>
      </div>

      <div class="bg-slate-900/60 border border-slate-800 p-6 rounded-2xl shadow-xl border-l-4 border-l-purple-500 relative overflow-hidden">
        <div class="flex justify-between items-start">
          <div>
            <h3 class="text-xs text-slate-400 uppercase font-semibold tracking-wider">Passing Percentage Rate</h3>
            <p id="passingRate" class="text-4xl font-extrabold text-slate-100 mt-2">0%</p>
          </div>
          <div class="p-3 bg-purple-500/10 rounded-xl">
            <i data-lucide="trending-up" class="w-6 h-6 text-purple-400"></i>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    lucide.createIcons();

    const firebaseConfig = {
      apiKey: "AIzaSyCpqbqUXrxADXC5xptI91dCy3H8PlZo7u8",
      authDomain: "gradingsystem-6fbdb.firebaseapp.com",
      databaseURL: "https://gradingsystem-6fbdb-default-rtdb.firebaseio.com",
      projectId: "gradingsystem-6fbdb",
      storageBucket: "gradingsystem-6fbdb.firebasestorage.app",
      messagingSenderId: "919646538223",
      appId: "1:919646538223:web:0e427c6ecbf1d7500cce1a",
      measurementId: "G-H8DCQTXKXW"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
      if (!user) window.location.href = 'index.html';
      else computeAnalytics();
    });

    async function computeAnalytics() {
      const snapshot = await db.collection('grades').get();
      if (snapshot.empty) return;

      let total = 0;
      let sum = 0;
      let passedCount = 0;

      snapshot.forEach(doc => {
        const grade = doc.data().finalGrade;
        sum += grade;
        total++;
        if (grade >= 75) passedCount++;
      });

      document.getElementById('totalRecords').textContent = total;
      document.getElementById('classAverage').textContent = (sum / total).toFixed(2);
      document.getElementById('passingRate').textContent = Math.round((passedCount / total) * 100) + '%';
    }

    function logout() {
      auth.signOut().then(() => window.location.href = 'index.html');
    }
  </script>
</body>
</html>
